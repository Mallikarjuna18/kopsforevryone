    kops.k8s.io/cluster: pennedbyarjun.blog #change to your cluster name
  name: admin
spec:
  publicKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPF9K7LDH7fSaXgtVVDbQm4K3nlWgfc7PZHpIfjAPpAH #change to your public SSH key
